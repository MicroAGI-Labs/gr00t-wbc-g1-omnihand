name: Recording pipeline tests

on:
  pull_request:
    paths:
      - "gear_sonic/**"
      - "pyproject.toml"
      - ".github/workflows/recording-tests.yml"
  push:
    branches: [main]
    paths:
      - "gear_sonic/**"
      - "pyproject.toml"
      - ".github/workflows/recording-tests.yml"

permissions:
  contents: read

jobs:
  recording:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download robot meshes used by FK and dataset tests
        run: git lfs pull --include="gear_sonic/data/robot_model/model_data/g1/meshes/*" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: gear_sonic/pyproject.toml
      - name: Install data collection and test dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e 'gear_sonic[data_collection]' pytest
      - name: Test teleop and recording without hardware
        run: |
          python -m pytest -q gear_sonic/tests gear_sonic/end_effectors/tests \
            --ignore=gear_sonic/end_effectors/tests/test_omnihand_mujoco.py
